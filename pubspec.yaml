name: punggawa_motor_manager
description: "Aplikasi manajemen bengkel sepeda motor modern yang sederhana dan mudah digunakan oleh mekanik."
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # State Management
  riverpod: ^2.4.11
  flutter_riverpod: ^2.4.11
  riverpod_generator: ^2.3.13
  
  # UI & Material Design 3
  google_fonts: ^6.1.0
  
  # Image handling
  image_picker: ^1.0.6
  cached_network_image: ^3.3.0
  
  # PDF Generation
  pdf: ^3.10.0
  printing: ^5.11.0
  qr_flutter: ^4.1.0
  
  # Networking & Serialization
  dio: ^5.3.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  permission_handler: ^11.4.4
  
  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
